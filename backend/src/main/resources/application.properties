server.address=127.0.0.1
server.port=8081
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/neuroforge}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${IAM_ISSUER:}
spring.security.oauth2.resourceserver.jwt.audiences=neuroforge
spring.sql.init.mode=never

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
